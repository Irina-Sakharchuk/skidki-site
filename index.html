<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">

  <title>Скидки на пике — актуальные акции и промокоды</title>

  <meta name="description" content="SkidkiNaPike — актуальные скидки и промокоды с маркетплейсов. Гаджеты, одежда, косметика, продукты и аксессуары в выгодных подборках.">
  <meta name="robots" content="index, follow">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f9;
      color: #111827;
    }

    header {
      background: #ffffff;
      padding: 25px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    #promo-container {
      display: grid;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      max-width: 320px;
    }

    .card img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .offer {
      border: 2px solid #ffe9a8;
      border-radius: 40px;
      padding: 20px;
      background-color: #fffdf5;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .offer:hover {
      background-color: #fff7d1;
      border-color: #ffd86b;
    }

    .category-btn {
      padding: 12px 18px;
      border: 2px solid #ffe08a;
      border-radius: 40px;
      background-color: #fffdf3;
      color: #8a6d00;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .category-btn:hover,
    .category-btn.active {
      background-color: #fff6c9;
      border-color: #ffd45c;
    }

    .promo-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0 12px 0;
    }

    .promo-btn {
      display: block;
      text-align: center;
      padding: 10px 12px;
      border-radius: 999px;
      background: #ffcc00;
      color: #000;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95em;
      transition: background-color 0.2s ease;
    }

    .promo-btn:hover {
      background: #ffdb4d;
    }

    @media (min-width: 768px) {
      #promo-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
<header>
  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 15px; max-width: 900px; margin: 0 auto;">
    <img src="https://github.com/Irina-Sakharchuk/skidki-site/blob/main/logo.jpg?raw=true"
         alt="SALE"
         style="width: 140px; height: auto; object-fit: contain;">

    <h1 style="margin: 0; font-size: 1.8em; line-height: 1.2;">
      Скидки на пике — лучшие акции и промокоды
    </h1>

    <p style="margin-top: 10px; color: #4b5563; max-width: 700px;">
      Добро пожаловать! Здесь вы найдёте лучшие предложения на гаджеты, одежду, продукты,
      косметику и аксессуары. Мы обновляем подборки ежедневно, чтобы вы экономили на покупках.
    </p>

    <input type="text" id="search" placeholder="Поиск акции..."
           style="padding: 10px; font-size: 1em; border: 1px solid #ccc; border-radius: 6px; min-width: 220px; max-width: 100%;">
  </div>

  <div id="categoryButtons" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px 20px; max-width: 1200px; margin: 40px auto; padding: 0 20px;">
    <button class="category-btn" data-category="all">Все бренды</button>
    <button class="category-btn" data-category="Онлайн-сервисы">Онлайн-сервисы</button>
    <button class="category-btn" data-category="Финансовые продукты">Финансовые продукты</button>
    <button class="category-btn" data-category="Еда и напитки">Еда и напитки</button>
    <button class="category-btn" data-category="Маркетплейсы">Маркетплейсы</button>
    <button class="category-btn" data-category="Красота и здоровье">Красота и здоровье</button>
    <button class="category-btn" data-category="Мода">Мода</button>
    <button class="category-btn" data-category="Путешествия">Путешествия</button>
    <button class="category-btn" data-category="Образование">Образование</button>
    <button class="category-btn" data-category="Спорт">Спорт</button>
    <button class="category-btn" data-category="Дом и ремонт">Дом и ремонт</button>
    <button class="category-btn" data-category="Товары для животных">Товары для животных</button>
  </div>
</header>

<main style="padding: 20px;">
  <div id="promo-container"></div>
</main>

<script>
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbyz7rJv5ruEf8ypxueJWZTznygwyNU6X20koSg3jplZfZpXsSl1D6Tyqc69H7LtfHSL/exec";

  async function loadPromos() {
    const res = await fetch(SHEET_URL);
    const data = await res.json();

    const container = document.getElementById("promo-container");
    const searchInput = document.getElementById("search");
    const categoryButtons = document.querySelectorAll('.category-btn');

   function render(items) {
  container.innerHTML = "";

  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "card offer";
    card.dataset.category = item.category;

    // Автоформатирование описания
    let formattedDescription = item.description
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")   // жирный текст
      .replace(/•\s?(.*)/g, "<li>$1</li>")                // списки
      .replace(/\n{2,}/g, "</p><p>")                      // абзацы
      .replace(/\n/g, "<br>");                            // переносы строк

    // Если есть <li>, оборачиваем в <ul>
    if (formattedDescription.includes("<li>")) {
      formattedDescription = formattedDescription.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");
    }

    card.innerHTML = `
      ${item.image ? `
        <img src="${item.image}" alt="${item.title}">
      ` : ""}

      <h2 style="margin-top: 0; margin-bottom: 10px;">
        ${item.title}
      </h2>

      <div class="promo-buttons">
        ${item.promo1 ? `<a href="${item.link1}" class="promo-btn">Промокод ${item.promo1}</a>` : ""}
        ${item.promo2 ? `<a href="${item.link2}" class="promo-btn">Промокод ${item.promo2}</a>` : ""}
        ${item.promo3 ? `<a href="${item.link3}" class="promo-btn">Промокод ${item.promo3}</a>` : ""}
      </div>

      <p style="margin-top: 10px;">
        ${formattedDescription}
      </p>

      <p style="color: #6b7280; font-size: 0.9em; margin-top: 12px;">
        Категория: ${item.category}
      </p>
    `;

    container.appendChild(card);
  });
}

    // начальный рендер
    render(data);

    // поиск
    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase();
      const filtered = data.filter(item =>
        item.title.toLowerCase().includes(query) ||
        (item.brand || "").toLowerCase().includes(query) ||
        item.category.toLowerCase().includes(query)
      );
      render(filtered);
    });

    // фильтр по категориям
    categoryButtons.forEach(button => {
      button.addEventListener('click', () => {
        const selected = button.dataset.category;

        categoryButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        const offers = document.querySelectorAll('.offer');
        offers.forEach(offer => {
          if (selected === 'all' || offer.dataset.category === selected) {
            offer.style.display = '';
          } else {
            offer.style.display = 'none';
          }
        });
      });
    });
  }

  loadPromos();
</script>
</body>
</html>
