<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Скидки на пике — актуальные акции и промокоды</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
      background: #f7f7f9;
      color: #111827;
    }

    header {
      background: #ffffff;
      padding: 25px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    #promo-container {
      display: grid;
      gap: 12px;
      justify-content: center;
      padding: 10px 15px;
    }

    @media (min-width: 768px) {
      #promo-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 20px;
      border-radius: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      max-width: 320px;
      transition: 0.3s ease;
    }

    .card:hover {
      background-color: #fff7d1;
      border-color: #ffd86b;
    }

    .card img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .promo-block {
      background: #fff7e0;
      padding: 12px;
      border-radius: 12px;
      margin: 10px 0;
      border-left: 4px solid #ffcc00;
    }

    .promo-code {
      font-weight: 700;
      font-size: 1.05em;
      margin-bottom: 6px;
    }

    .big-promo-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px 14px;
      border-radius: 999px;
      background: #ffcc00;
      color: #000;
      font-weight: 700;
      text-decoration: none;
      font-size: 1em;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .big-promo-btn:hover {
      background: #ffdb4d;
    }

    .description-wrapper {
      margin-top: 10px;
    }

    .description-text {
      white-space: normal;
      max-height: 70px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .description-text.open {
      max-height: none !important;
    }

    .toggle-description {
      background: none;
      border: none;
      color: #b88600;
      font-weight: 600;
      cursor: pointer;
      padding: 5px 0;
      font-size: 0.95em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .toggle-arrow.open {
      transform: rotate(180deg);
    }
  </style>
</head>

<body>

<header>
  <div style="text-align:center; max-width:900px; margin:0 auto;">
    <img src="https://github.com/Irina-Sakharchuk/skidki-site/blob/main/logo.jpg?raw=true"
         alt="SALE"
         style="width:140px; margin-bottom:10px;">

    <h1 style="margin:0; font-size:1.8em;">Скидки на пике — лучшие акции и промокоды</h1>

    <p style="color:#4b5563; max-width:700px; margin:10px auto 20px;">
      Добро пожаловать! Здесь вы найдёте лучшие предложения на гаджеты, одежду, продукты,
      косметику и аксессуары. Мы обновляем подборки ежедневно, чтобы вы экономили на покупках.
    </p>

    <input id="search" type="text" placeholder="Поиск акции..."
           style="padding:10px; border:1px solid #ccc; border-radius:6px; width:260px;">
  </div>
</header>

<main>
  <div id="promo-container"></div>
</main>

<script>
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbyz7rJv5ruEf8ypxueJWZTznygwyNU6X20koSg3jplZfZpXsSl1D6Tyqc69H7LtfHSL/exec";

  async function loadPromos() {
    const res = await fetch(SHEET_URL);
    const data = await res.json();

    const container = document.getElementById("promo-container");
    const searchInput = document.getElementById("search");

    function safeFormat(text) {
      return (text || "")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n{2,}/g, "<br><br>")
        .replace(/\n/g, "<br>")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function render(items) {
      container.innerHTML = "";

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const description = safeFormat(item.description);

        let promoHTML = "";

        if (item.promo1) {
          promoHTML = `
            <div class="promo-block">
              <div class="promo-code">Промокод: ${item.promo1}</div>
              <button class="big-promo-btn" onclick="copyAndGo('${item.promo1}', '${item.link1}', this)">
                Скопировать и перейти →
              </button>
            </div>`;
        } else {
          promoHTML = `
            <div class="promo-block">
              <button class="big-promo-btn" onclick="window.open('${item.link1}', '_blank')">
                Переходи по ссылке →
              </button>
            </div>`;
        }

        card.innerHTML = `
          ${item.image ? `<img src="${item.image}" alt="${item.title}">` : ""}
          <h2>${item.title}</h2>

          ${promoHTML}

          <div class="description-wrapper">
            <p class="description-text">${description}</p>
            <button class="toggle-description">
              Подробнее
              <span class="toggle-arrow">⌄</span>
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    render(data);

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase();
      render(data.filter(item =>
        item.title.toLowerCase().includes(q) ||
        (item.brand || "").toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q)
      ));
    });

    container.addEventListener("click", (e) => {
      const btn = e.target.closest(".toggle-description");
      if (!btn) return;

      const card = btn.closest(".card");
      if (!card) return;

      const text = card.querySelector(".description-text");
      const arrow = btn.querySelector(".toggle-arrow");

      if (!text || !arrow) return;

      const isOpen = text.classList.toggle("open");

      if (isOpen) {
        arrow.classList.add("open");
        btn.childNodes[0].textContent = "Скрыть ";
      } else {
        arrow.classList.remove("open");
        btn.childNodes[0].textContent = "Подробнее ";
      }
    });
  }

  function copyAndGo(code, url, btn) {
    navigator.clipboard.writeText(code).then(() => {
      const original = btn.textContent;
      btn.textContent = "✓ Скопировано";
      btn.style.background = "#16a34a";

      setTimeout(() => {
        btn.textContent = original;
        btn.style.background = "#ffcc00";
      }, 1000);

      window.open(url, "_blank");
    });
  }

  loadPromos();
</script>

</body>
</html>
