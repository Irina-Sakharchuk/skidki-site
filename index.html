<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">

  <title>Скидки на пике — актуальные акции и промокоды</title>

  <!-- SEO -->
  <meta name="description" content="SkidkiNaPike — актуальные скидки и промокоды с маркетплейсов. Гаджеты, одежда, косметика, продукты и аксессуары в выгодных подборках.">
  <meta name="robots" content="index, follow">

  <!-- Стили -->
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f9;
      color: #111827;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 8px;
    }
    .copy-btn {
      padding: 10px 14px;
      font-size: 0.95em;
      background: #fb923c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
  </style>
</head>

<body>
  <header style="background: #ffffff; padding: 20px; border-bottom: 1px solid #e5e7eb;">
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="https://promo.getblogger.ru/files/logo/logo_3979dbffb0e42f4c6f640032d79622f0.jpg"
           alt="SkidkiNaPike"
           style="height: 60px; width: 60px; border-radius: 8px; object-fit: cover;">
      <h1 style="margin: 0; font-size: 1.8em; line-height: 1.2;">
        Скидки на пике — лучшие акции и промокоды
      </h1>
    </div>

    <p style="margin-top: 10px; color: #4b5563; max-width: 700px;">
      Добро пожаловать! Здесь вы найдёте лучшие предложения на гаджеты, одежду, продукты,
      косметику и аксессуары. Мы обновляем подборки ежедневно, чтобы вы экономили на покупках.
    </p>
  </header>

  <!-- Контейнер -->
  <main style="padding: 20px;">
    <input type="text" id="search" placeholder="Поиск акции..." style="width: 100%; padding: 10px; margin-bottom: 20px; font-size: 1em;">
    <div id="promo-container" style="display: grid; gap: 20px;"></div>
  </main>

  <!-- JavaScript -->
  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbyUuoCyjl4gaVT1CxUaMghroQO5Zdz6eMC-rq6WVQV-ZQqAMs-XY-6-dhDxW5s5hBE/exec";

    async function loadPromos() {
      const res = await fetch(SHEET_URL);
      const data = await res.json();
      const container = document.getElementById("promo-container");
      const searchInput = document.getElementById("search");

      function render(items) {
        container.innerHTML = "";
        items.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <h2 style="margin-top: 0;">${item.title}</h2>
            <p><strong>${item.brand}</strong> — ${item.description}</p>

            ${item.promokod ? `
              <div style="background: #fff7ed; padding: 10px; border-left: 4px solid #fb923c; border-radius: 6px; margin: 10px 0;">
                <p style="margin: 0 0 8px 0;">
                  <strong>Промокод:</strong>
                  <span style="font-family: monospace;" id="code-${item.id}">${item.promokod}</span>
                </p>

                <button id="btn-${item.id}"
                  onclick="copyAndGo('${item.id}', '${item.link}')"
                  class="copy-btn">
                  Скопировать и перейти на сайт
                </button>
              </div>
            ` : ""}

            ${item.image ? `<img src="${item.image}" alt="${item.brand}" style="max-width: 100%; border-radius: 6px; margin: 10px 0;">` : ""}

            <a href="${item.link}" target="_blank" style="color: #2563eb;">Перейти к акции</a>
            <p style="color: #6b7280; font-size: 0.9em;">Категория: ${item.category}</p>
          `;

          container.appendChild(card);
        });
      }

      render(data);

      searchInput.addEventListener("input", () => {
        const query = searchInput.value.toLowerCase();
        const filtered = data.filter(item =>
          item.title.toLowerCase().includes(query) ||
          item.brand.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query)
        );
        render(filtered);
      });
    }

    // Кнопка: копировать + анимация + переход
    function copyAndGo(id, url) {
      const code = document.getElementById(`code-${id}`).textContent;
      const btn = document.getElementById(`btn-${id}`);

      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.textContent;

        btn.textContent = "✓ Скопировано";
        btn.style.background = "#16a34a";

        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = "#fb923c";
        }, 1000);

        window.open(url, "_blank");
      });
    }

    loadPromos();
  </script>

</body>
</html>
