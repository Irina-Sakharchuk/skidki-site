<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">

  <title>Скидки на пике — актуальные акции и промокоды</title>

  <!-- SEO -->
  <meta name="description" content="SkidkiNaPike — актуальные скидки и промокоды с маркетплейсов. Гаджеты, одежда, косметика, продукты и аксессуары в выгодных подборках. Экономьте на онлайн-покупках и не пропускайте лучшие акции.">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (для соцсетей) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Скидки на пике — SkidkiNaPike">
  <meta property="og:description" content="Ваш гид по актуальным скидкам на маркетплейсах: гаджеты, одежда, косметика, продукты и многое другое.">
  <meta property="og:url" content="https://ТВОЙ-ЛОГИН.github.io/skidki-site/">
  <meta property="og:image" content="https://ТВОЙ-ДОМЕН/путь-к-картинке.jpg">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Скидки на пике — SkidkiNaPike">
  <meta name="twitter:description" content="Лучшие скидки и промокоды с маркетплейсов в одном месте.">
  <meta name="twitter:image" content="https://ТВОЙ-ДОМЕН/путь-к-картинке.jpg">

  <!-- Стили -->
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f9;
      color: #111827;
    }
  </style>
</head>

<body>
  <header style="background: #ffffff; padding: 20px; border-bottom: 1px solid #e5e7eb;">
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="https://promo.getblogger.ru/files/logo/logo_3979dbffb0e42f4c6f640032d79622f0.jpg"
           alt="SkidkiNaPike"
           style="height: 60px; width: 60px; border-radius: 8px; object-fit: cover;">
      <h1 style="margin: 0; font-size: 1.8em; line-height: 1.2;">
        Скидки на пике — лучшие акции и промокоды
      </h1>
    </div>

    <p style="margin-top: 10px; color: #4b5563; max-width: 700px;">
      Добро пожаловать! Здесь вы найдёте лучшие предложения на гаджеты, одежду, продукты,
      косметику и аксессуары. Мы обновляем подборки ежедневно, чтобы вы экономили на покупках.
    </p>
  </header>

  <!-- 🔥 Контейнер для поиска и карточек -->
  <main style="padding: 20px;">
    <input type="text" id="search" placeholder="Поиск акции..." style="width: 100%; padding: 10px; margin-bottom: 20px; font-size: 1em;">
    <div id="promo-container" style="display: grid; gap: 20px;"></div>
  </main>

  <!-- 🔥 JavaScript — строго перед </body> -->
  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbxxIFgjwYXTo4AAbd39UyT_Wjx4IAC0Sb0c4WomFASAs74QfqT2Zjfp086VKSVe60E/exec";

    async function loadPromos() {
      const res = await fetch(SHEET_URL);
      const data = await res.json();
      const container = document.getElementById("promo-container");
      const searchInput = document.getElementById("search");

      function render(items) {
        container.innerHTML = "";
        items.forEach(item => {
          const card = document.createElement("div");
          card.style = "background: white; border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px;";
          card.innerHTML = `
            <h2 style="margin-top: 0;">${item.title}</h2>
            <p><strong>${item.brand}</strong> — ${item.description}</p>
            ${item.image ? `<img src="${item.image}" alt="${item.brand}" style="max-width: 100%; border-radius: 6px; margin: 10px 0;">` : ""}
            <a href="${item.link}" target="_blank" style="color: #2563eb;">Перейти к акции</a>
            <p style="color: #6b7280; font-size: 0.9em;">Категория: ${item.category}</p>
          `;
          container.appendChild(card);
        });
      }

      render(data);

      searchInput.addEventListener("input", () => {
        const query = searchInput.value.toLowerCase();
        const filtered = data.filter(item =>
          item.title.toLowerCase().includes(query) ||
          item.brand.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query)
        );
        render(filtered);
      });
    }

    loadPromos();
  </script>

</body>
</html>
